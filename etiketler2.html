<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>P3 Depo Mavi Reyon Raf Etiketleri (041 - 080)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
    body { background: #f0f2f5; padding: 15px; }
    
    .print-bar {
      max-width: 950px;
      margin: 0 auto 15px auto;
      background: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .btn {
      background: #0056b3;
      color: #fff;
      border: none;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 950px;
      margin: 0 auto;
    }

    .label-card {
      background: #fff;
      border: 2px dashed #0056b3;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .brand {
      font-size: 10px;
      font-weight: 800;
      color: #d90429;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .qr-img {
      width: 125px;
      height: 125px;
      margin-bottom: 4px;
    }
    .rack-code {
      font-size: 13px;
      font-weight: 900;
      color: #000;
      letter-spacing: 0.2px;
      word-break: break-all;
    }

    @media print {
      body { background: #fff; padding: 0; }
      .print-bar { display: none; }
      .grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        width: 100%;
      }
      .label-card {
        page-break-inside: avoid;
        border: 1.5px dashed #444;
        padding: 6px;
      }
      .qr-img {
        width: 110px;
        height: 110px;
      }
      .rack-code {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="print-bar">
    <div>
      <h3 style="color:#0056b3;">Boyner Emaar P3 - Mavi Reyon Raf QR Kodları</h3>
      <p style="font-size:12px; color:#666;">P3MAVİSTR-041 - P3MAVİSTR-080 (Toplam 40 Adet)</p>
    </div>
    <button class="btn" onclick="window.print()">🖨️ Sayfayı Yazdır (A4)</button>
  </div>

  <div class="grid" id="label-container"></div>

  <script>
    const container = document.getElementById('label-container');
    for (let i = 41; i <= 80; i++) {
      const num = i < 100 ? '0' + i : i;
      const code = `P3MAVİSTR-${num}`;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data=${encodeURIComponent(code)}`;

      const card = document.createElement('div');
      card.className = 'label-card';
      card.innerHTML = `
        <div class="brand">BOYNER EMAAR P3</div>
        <img class="qr-img" src="${qrUrl}" alt="${code}">
        <div class="rack-code">${code}</div>
      `;
      container.appendChild(card);
    }
  </script>
</body>
</html>
