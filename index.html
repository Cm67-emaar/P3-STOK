<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Boyner P3 Depo Terminali</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 14px; padding-bottom: 90px; background: #f8fafc; color: #0f172a; text-align: center; min-height: 100vh; position: relative; }
    
    /* Üst Bar */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 2px solid #fee2e2; margin-bottom: 16px; }
    .brand { font-size: 20px; font-weight: 900; color: #dc2626; letter-spacing: -0.5px; }
    
    /* Büyük Dokunmatik Butonlar */
    button { background: #dc2626; color: #fff; border: none; padding: 14px 18px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    button:active { transform: scale(0.97); }
    button.outline { background: #fff; color: #dc2626; border: 2px solid #dc2626; }
    button.success { background: #16a34a; color: #fff; }
    button.warning { background: #ea580c; color: #fff; }
    button.secondary { background: #e2e8f0; color: #334155; }
    button.dark { background: #1e293b; color: #fff; }

    /* Büyük Giriş Kutuları */
    input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff; color: #0f172a; font-size: 18px; font-weight: 600; margin-bottom: 12px; outline: none; }
    input:focus { border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15); }
    
    /* Kartlar */
    .card { background: #ffffff; border-radius: 16px; padding: 16px; margin-bottom: 16px; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
    .card-title { font-size: 17px; font-weight: 800; color: #1e293b; margin-top: 0; margin-bottom: 12px; }

    /* Raf Listesi & Akordeon */
    .raf-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
    .raf-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; cursor: pointer; background: #fff; }
    .raf-header:active { background: #f8fafc; }
    .raf-items-box { padding: 12px 16px; background: #f8fafc; border-top: 1px solid #e2e8f0; }
    
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #cbd5e1; font-size: 15px; }
    .badge { background: #fee2e2; color: #dc2626; font-weight: 800; padding: 4px 10px; border-radius: 8px; font-size: 13px; }
    
    #reader, #qrReaderBox { width: 100%; min-height: 260px; background: #000; border-radius: 14px; overflow: hidden; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    
    /* Sabit Alt Bilgi (Yaratıcılar) */
    footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; border-top: 2px solid #fee2e2; padding: 10px 14px; box-shadow: 0 -4px 10px rgba(0,0,0,0.03); z-index: 900; }
    .creators-title { font-size: 11px; font-weight: 800; color: #dc2626; text-transform: uppercase; letter-spacing: 0.5px; }
    .creators-names { font-size: 13px; font-weight: 700; color: #1e293b; margin-top: 2px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">BOYNER P3</div>
    <div>
      <button id="loginBtn" onclick="openLoginModal()" class="outline" style="padding:10px 14px;">Yetkili Girişi</button>
      <div id="userBadge" style="display:none; align-items:center; gap:8px;">
        <span id="activeUserName" style="font-weight:700; color:#dc2626; font-size:13px;"></span>
        <button onclick="doLogout()" class="secondary" style="padding:8px 12px; font-size:13px;">Çıkış</button>
      </div>
    </div>
  </header>

  <!-- 1. PERSONEL ARAMA MODU -->
  <div id="searchSec" class="card">
    <div class="card-title">Ürün Nerede?</div>
    <input type="text" id="searchInp" placeholder="Barkodu buraya yazın..." oninput="doSearch()">
    <div id="searchRes"></div>
  </div>

  <!-- 2. YETKİLİ PANELİ -->
  <div id="adminSec" style="display:none;">
    <div class="card">
      <div class="card-title">Yeni Raf Ekle</div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newRafInp" placeholder="Raf Adı (Örn: P3-05)" style="margin-bottom:0;">
        <button onclick="addManualRaf()" class="dark" style="white-space:nowrap;">+ Ekle</
