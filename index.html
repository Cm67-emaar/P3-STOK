<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Boyner P3 Depo Terminali</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 14px; padding-bottom: 90px; background: #f8fafc; color: #0f172a; text-align: center; min-height: 100vh; position: relative; }
    
    /* Üst Bar */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 2px solid #fee2e2; margin-bottom: 16px; }
    .brand { font-size: 20px; font-weight: 900; color: #dc2626; letter-spacing: -0.5px; }
    
    /* Büyük Dokunmatik Butonlar */
    button { background: #dc2626; color: #fff; border: none; padding: 14px 18px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    button:active { transform: scale(0.97); }
    button.outline { background: #fff; color: #dc2626; border: 2px solid #dc2626; }
    button.success { background: #16a34a; color: #fff; }
    button.warning { background: #ea580c; color: #fff; }
    button.secondary { background: #e2e8f0; color: #334155; }
    button.dark { background: #1e293b; color: #fff; }

    /* Büyük Giriş Kutuları */
    input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff; color: #0f172a; font-size: 18px; font-weight: 600; margin-bottom: 12px; outline: none; }
    input:focus { border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15); }
    
    /* Kartlar */
    .card { background: #ffffff; border-radius: 16px; padding: 16px; margin-bottom: 16px; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
    .card-title { font-size: 17px; font-weight: 800; color: #1e293b; margin-top: 0; margin-bottom: 12px; }

    /* Raf Listesi & Akordeon */
    .raf-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
    .raf-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; cursor: pointer; background: #fff; }
    .raf-header:active { background: #f8fafc; }
    .raf-items-box { padding: 12px 16px; background: #f8fafc; border-top: 1px solid #e2e8f0; }
    
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #cbd5e1; font-size: 15px; }
    .badge { background: #fee2e2; color: #dc2626; font-weight: 800; padding: 4px 10px; border-radius: 8px; font-size: 13px; }
    
    #reader, #qrReaderBox { width: 100%; min-height: 260px; background: #000; border-radius: 14px; overflow: hidden; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    
    /* Sabit Alt Bilgi (Yaratıcılar) */
    footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; border-top: 2px solid #fee2e2; padding: 10px 14px; box-shadow: 0 -4px 10px rgba(0,0,0,0.03); z-index: 900; }
    .creators-title { font-size: 11px; font-weight: 800; color: #dc2626; text-transform: uppercase; letter-spacing: 0.5px; }
    .creators-names { font-size: 13px; font-weight: 700; color: #1e293b; margin-top: 2px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">BOYNER P3</div>
    <div>
      <button id="loginBtn" onclick="openLoginModal()" class="outline" style="padding:10px 14px;">Yetkili Girişi</button>
      <div id="userBadge" style="display:none; align-items:center; gap:8px;">
        <span id="activeUserName" style="font-weight:700; color:#dc2626; font-size:13px;"></span>
        <button onclick="doLogout()" class="secondary" style="padding:8px 12px; font-size:13px;">Çıkış</button>
      </div>
    </div>
  </header>

  <!-- 1. PERSONEL ARAMA MODU -->
  <div id="searchSec" class="card">
    <div class="card-title">Ürün Nerede?</div>
    <input type="text" id="searchInp" placeholder="Barkodu buraya yazın..." oninput="doSearch()">
    <div id="searchRes"></div>
  </div>

  <!-- 2. YETKİLİ PANELİ -->
  <div id="adminSec" style="display:none;">
    <div class="card">
      <div class="card-title">Yeni Raf Ekle</div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newRafInp" placeholder="Raf Adı (Örn: P3-05)" style="margin-bottom:0;">
        <button onclick="addManualRaf()" class="dark" style="white-space:nowrap;">+ Ekle</button>
      </div>
      <div style="margin-top:10px;">
        <button onclick="startAddRafWithQr()" class="outline" style="width:100%;">📷 QR Kod Okutarak Raf Ekle</button>
      </div>
      <div id="qrAddReaderSec" style="display:none; margin-top:10px;">
        <div id="qrReaderBox"></div>
        <button onclick="stopAddRafWithQr()" class="secondary" style="width:100%; margin-top:8px;">Kamerayı Kapat</button>
      </div>
    </div>

    <!-- RAFLAR LİSTESİ -->
    <div class="card">
      <div class="card-title">Raflar (Detay için rafa dokunun)</div>
      <div id="rafListContainer"></div>
    </div>
  </div>

  <!-- 3. KESİNTİSİZ SAYIM KAMERASI -->
  <div id="scanSec" class="card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div>Raf: <strong id="curRafText" style="color:#dc2626; font-size:22px;"></strong></div>
      <button onclick="abortScan()" class="secondary">İptal</button>
    </div>
    <div id="reader"></div>
    <div style="margin-top:14px; display:flex; justify-content:space-between; align-items:center;">
      <div>Eklenen: <strong id="scanCounter" style="color:#16a34a; font-size:26px;">0</strong> Adet</div>
      <button onclick="stopAndSave()" class="success" style="padding:14px 20px;">Kaydet & Ekle</button>
    </div>
  </div>

  <!-- QR GÖSTERİM MODALI -->
  <div id="qrModal" class="modal-overlay" style="display:none;">
    <div class="card" style="width:100%; max-width:320px; text-align:center;">
      <h3 id="qrTitle" style="margin-top:0;">Raf QR</h3>
      <div id="qrImgBox" style="margin:16px 0;"></div>
      <button onclick="closeQrModal()" class="secondary" style="width:100%;">Kapat</button>
    </div>
  </div>

  <!-- GİRİŞ MODAL -->
  <div id="authModal" class="modal-overlay" style="display:none;">
    <div class="card" style="width:100%; max-width:320px;">
      <div class="card-title">Yetkili Girişi</div>
      <input type="text" id="authUser" placeholder="Kullanıcı Adı">
      <input type="password" id="authPass" placeholder="Şifre">
      <div style="display:flex; gap:8px;">
        <button onclick="submitLogin()" style="flex:1;">Giriş</button>
        <button onclick="closeLoginModal()" class="secondary" style="flex:1;">Kapat</button>
      </div>
    </div>
  </div>

  <!-- HER SAYFADA SABİT YARATICILAR FOOTER -->
  <footer>
    <div class="creators-title">Yaratıcılar & Fikir Sahipleri</div>
    <div class="creators-names">
      Cengizhan Kadiroğlu &bull; Melih Kerim
    </div>
  </footer>

  <script>
    // Kullanıcı Tanımları
    const VALID_USERS = {
      "cengizhankadiroglu": { pass: "182775", name: "Cengizhan Kadiroğlu" },
      "melihkerim": { pass: "203840", name: "Melih Kerim" }
    };

    var db = JSON.parse(localStorage.getItem("p3_depo_v2") || '{"P3-01": {"8684497451938": 3}}');
    var activeRaf = "";
    var currentBatch = {};
    var scanner = null;
    var qrAddScanner = null;
    var lastCode = "";
    var lastTime = 0;
    var openRafDetails = {};

    function saveDB() {
      localStorage.setItem("p3_depo_v2", JSON.stringify(db));
    }

    function bip() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 1400;
        gain.gain.value = 0.3;
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      } catch(e){}
    }

    // Ürün Arama
    function doSearch() {
      var val = document.getElementById("searchInp").value.trim();
      var res = document.getElementById("searchRes");
      if(!val) { res.innerHTML = ""; return; }
      
      var found = [];
      for(var r in db) {
        if(db[r] && db[r][val]) found.push({ raf: r, qty: db[r][val] });
      }

      if(found.length === 0) {
        res.innerHTML = "<div style='color:#dc2626; padding:10px 0; font-weight:600;'>Bu barkod hiçbir rafta bulunamadı.</div>";
      } else {
        var h = "";
        for(var i=0; i<found.length; i++) {
          h += "<div class='item-row'><span>Raf: <strong>" + found[i].raf + "</strong></span><span class='badge'>" + found[i].qty + " Adet</span></div>";
        }
        res.innerHTML = h;
      }
    }

    // Yetkili Girişi
    function openLoginModal() { document.getElementById("authModal").style.display = "flex"; }
    function closeLoginModal() { document.getElementById("authModal").style.display = "none"; }
    
    function submitLogin() {
      var u = document.getElementById("authUser").value.trim().toLowerCase();
      var p = document.getElementById("authPass").value.trim();
      
      if(VALID_USERS[u] && VALID_USERS[u].pass === p) {
        closeLoginModal();
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("userBadge").style.display = "inline-flex";
        document.getElementById("activeUserName").innerText = VALID_USERS[u].name;
        document.getElementById("adminSec").style.display = "block";
        renderRaflar();
      } else {
        alert("Hatalı kullanıcı adı veya şifre!");
      }
    }

    function doLogout() {
      document.getElementById("loginBtn").style.display = "inline-flex";
      document.getElementById("userBadge").style.display = "none";
      document.getElementById("adminSec").style.display = "none";
    }

    // Raf Ekleme (Elle & QR)
    function addManualRaf() {
      var name = document.getElementById("newRafInp").value.trim().toUpperCase();
      if(!name) return;
      if(!db[name]) db[name] = {};
      document.getElementById("newRafInp").value = "";
      saveDB();
      renderRaflar();
    }

    function startAddRafWithQr() {
      document.getElementById("qrAddReaderSec").style.display = "block";
      qrAddScanner = new Html5Qrcode("qrReaderBox");
      qrAddScanner.start(
        { facingMode: "environment" },
        { fps: 20, qrbox: { width: 200, height: 200 } },
        function(code) {
          bip();
          var rafName = code.trim().toUpperCase();
          if(!db[rafName]) db[rafName] = {};
          saveDB();
          stopAddRafWithQr();
          renderRaflar();
          alert("'" + rafName + "' rafı başarıyla eklendi!");
        }
      ).catch(function(err){
        alert("Kamera açılamadı: " + err);
        stopAddRafWithQr();
      });
    }

    function stopAddRafWithQr() {
      if(qrAddScanner) {
        qrAddScanner.stop().then(function(){
          document.getElementById("qrAddReaderSec").style.display = "none";
          qrAddScanner = null;
        }).catch(function(){
          document.getElementById("qrAddReaderSec").style.display = "none";
          qrAddScanner = null;
        });
      } else {
        document.getElementById("qrAddReaderSec").style.display = "none";
      }
    }

    // Akordeon Detay
    function toggleRafDetails(r) {
      openRafDetails[r] = !openRafDetails[r];
      renderRaflar();
    }

    // Raf İçi Ürün Yönetimi
    function updateItemCount(raf, code, delta) {
      if(!db[raf] || !db[raf][code]) return;
      db[raf][code] += delta;
      if(db[raf][code] <= 0) delete db[raf][code];
      saveDB();
      renderRaflar();
    }

    function deleteItemDirectly(raf, code) {
      if(confirm(code + " barkodlu ürünü bu raftan silmek istediğinize emin misiniz?")) {
        delete db[raf][code];
        saveDB();
        renderRaflar();
      }
    }

    function deleteFullRaf(r) {
      if(confirm(r + " rafını ve içindeki TÜM ürünleri kalıcı olarak silmek istiyor musunuz?")) {
        delete db[r];
        saveDB();
        renderRaflar();
      }
    }

    function showQrModal(r) {
      document.getElementById("qrTitle").innerText = r + " QR Kodu";
      var url = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(r);
      document.getElementById("qrImgBox").innerHTML = "<img src='" + url + "' style='max-width:200px; height:auto; display:inline-block;' />";
      document.getElementById("qrModal").style.display = "flex";
    }

    function closeQrModal() { document.getElementById("qrModal").style.display = "none"; }

    // Rafları Ekrana Basma
    function renderRaflar() {
      var cont = document.getElementById("rafListContainer");
      var html = "";
      
      for(var r in db) {
        var totalQty = 0;
        var itemsHtml = "";
        
        for(var code in db[r]) {
          var qty = db[r][code];
          totalQty += qty;
          itemsHtml += 
            "<div class='item-row'>" +
              "<div><strong>" + code + "</strong></div>" +
              "<div style='display:flex; align-items:center; gap:8px;'>" +
                "<button onclick='updateItemCount(\"" + r + "\", \"" + code + "\", -1)' class='secondary' style='padding:4px 10px; font-size:16px;'>-</button>" +
                "<span class='badge'>" + qty + " Adet</span>" +
                "<button onclick='updateItemCount(\"" + r + "\", \"" + code + "\", 1)' class='secondary' style='padding:4px 10px; font-size:16px;'>+</button>" +
                "<button onclick='deleteItemDirectly(\"" + r + "\", \"" + code + "\")' class='outline' style='padding:4px 8px; font-size:12px; margin-left:4px;'>🗑️</button>" +
              "</div>" +
            "</div>";
        }

        if(!itemsHtml) {
          itemsHtml = "<div style='color:#94a3b8; font-size:14px; padding:6px 0;'>Bu rafta henüz ürün yok.</div>";
        }

        var isOpen = openRafDetails[r];

        html += 
          "<div class='raf-card'>" +
            "<div class='raf-header'>" +
              "<div onclick='toggleRafDetails(\"" + r + "\")' style='flex:1; text-align:left;'>" +
                "<div style='font-size:18px; font-weight:800; color:#1e293b;'>" + r + " " + (isOpen ? "▲" : "▼") + "</div>" +
                "<div style='color:#dc2626; font-size:13px; font-weight:700;'>" + totalQty + " Adet Toplam Ürün</div>" +
              "</div>" +
              "<div style='display:flex; gap:6px;'>" +
                "<button onclick='startScan(\"" + r + "\")' class='success' style='padding:8px 12px; font-size:13px;'>+ Sayım Ekle</button>" +
                "<button onclick='showQrModal(\"" + r + "\")' class='outline' style='padding:8px 10px; font-size:13px;'>QR</button>" +
                "<button onclick='deleteFullRaf(\"" + r + "\")' class='secondary' style='padding:8px 8px; font-size:12px;'>🗑️</button>" +
              "</div>" +
            "</div>" +
            (isOpen ? "<div class='raf-items-box'>" + itemsHtml + "</div>" : "") +
          "</div>";
      }
      cont.innerHTML = html;
    }

    // Kesintisiz Sayım Motoru (Üzerine Ekleme Modu)
    function startScan(r) {
      activeRaf = r;
      currentBatch = {};
      lastCode = "";
      document.getElementById("curRafText").innerText = r;
      document.getElementById("scanCounter").innerText = "0";
      document.getElementById("searchSec").style.display = "none";
      document.getElementById("adminSec").style.display = "none";
      document.getElementById("scanSec").style.display = "block";

      scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 22, qrbox: { width: 260, height: 160 } },
        function(code) {
          var now = Date.now();
          if(code === lastCode && (now - lastTime) < 1200) return;
          lastCode = code;
          lastTime = now;
          bip();
          
          currentBatch[code] = (currentBatch[code] || 0) + 1;
          var totalBatch = 0;
          for(var x in currentBatch) { totalBatch += currentBatch[x]; }
          document.getElementById("scanCounter").innerText = totalBatch;
        }
      ).catch(function(err){
        alert("Kamera açılamadı: " + err);
        abortScan();
      });
    }

    function abortScan() {
      if(scanner) {
        scanner.stop().then(function(){ resetViews(); }).catch(function(){ resetViews(); });
      } else {
        resetViews();
      }
    }

    function stopAndSave() {
      if(scanner) {
        scanner.stop().then(function(){ applyBatch(); }).catch(function(){ applyBatch(); });
      } else {
        applyBatch();
      }
    }

    function applyBatch() {
      if(!db[activeRaf]) db[activeRaf] = {};
      for(var code in currentBatch) {
        db[activeRaf][code] = (db[activeRaf][code] || 0) + currentBatch[code];
      }
      saveDB();
      resetViews();
      openRafDetails[activeRaf] = true;
      renderRaflar();
      alert(activeRaf + " rafına sayılan ürünler eklendi!");
    }

    function resetViews() {
      document.getElementById("scanSec").style.display = "none";
      document.getElementById("searchSec").style.display = "block";
      document.getElementById("adminSec").style.display = "block";
    }
  </script>
</body>
</html>
