<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Boyner P3 Depo Terminali</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- QR Kod Üretici Kütüphane -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background: #0f172a; color: #f8fafc; text-align: center; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #334155; margin-bottom: 16px; }
    .brand { font-size: 18px; font-weight: 800; color: #38bdf8; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    button.danger { background: #ef4444; color: #fff; }
    button.warning { background: #f59e0b; color: #fff; }
    button.success { background: #22c55e; color: #fff; }
    button.secondary { background: #334155; color: #fff; }
    button.qr-btn { background: #6366f1; color: #fff; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 16px; margin-bottom: 8px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 14px; text-align: left; }
    #reader, #searchReader, #qrSelectReader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 240px; }
    .history-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 14px; }
    .badge { background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
    .hidden { display: none !important; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  </style>
</head>
<body>

  <header>
    <div class="brand">Boyner P3 Depo</div>
    <div id="authActions">
      <button onclick="showAuthModal()" id="loginBtn">Yetkili Girişi</button>
      <button onclick="logout()" id="logoutBtn" class="danger hidden">Çıkış</button>
    </div>
  </header>

  <!-- 1. PERSONEL ARAMA MODU -->
  <div id="searchView">
    <div class="card">
      <h3 style="margin-top:0;">Ürün Nerede?</h3>
      <div style="display:flex; gap:8px;">
        <input type="text" id="searchInput" placeholder="Barkod yazın..." oninput="searchProduct()">
        <button onclick="startSearchCamera()" class="secondary" style="height:44px; white-space:nowrap;">📷 Oku</button>
      </div>
      <div id="searchCameraBox" class="hidden" style="margin-top:10px;">
        <div id="searchReader"></div>
        <button onclick="stopSearchCamera()" class="danger" style="width:100%; margin-top:8px;">Kamerayı Kapat</button>
      </div>
      <div id="searchResult" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- 2. YETKİLİ SAYIM VE RAF PANELİ -->
  <div id="adminView" class="hidden">
    <div class="card">
      <h3 style="margin-top:0;">Raf Yönetimi & Sayım</h3>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newRafInput" placeholder="Yeni Raf Kodu (Örn: P3-05)">
        <button onclick="addNewRaf()" class="success" style="white-space:nowrap;">+ Raf Ekle</button>
      </div>
      <div style="margin-top:6px; margin-bottom:12px;">
        <button onclick="startQrRafSelect()" class="qr-btn" style="width:100%;">📷 Raf QR'ı Okutarak Sayıma Başla</button>
      </div>
      <div id="rafQrReaderBox" class="hidden" style="margin-bottom:12px;">
        <div id="qrSelectReader"></div>
        <button onclick="stopQrRafSelect()" class="danger" style="width:100%; margin-top:8px;">Kamerayı Kapat</button>
      </div>
      <div id="rafList"></div>
    </div>
  </div>

  <!-- 3. KESİNTİSİZ SAYIM EKRANI (KAMERA) -->
  <div id="scannerView" class="hidden">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong>Aktif Raf:</strong> <span id="currentScanningRaf" style="color:#38bdf8; font-size:18px;">---</span></div>
        <button onclick="stopScanning()" class="secondary">Vazgeç</button>
      </div>
      <div id="reader" style="margin-top:12px;"></div>
      <div style="margin-top:12px; display:flex; justify-content:space-between; align-items:center; font-size:16px;">
        <div>Okutulan: <strong id="scanCount" style="color:#22c55e; font-size:22px;">0</strong></div>
        <button onclick="finishScanning()" class="success">Sayımı Bitir</button>
      </div>
    </div>
  </div>

  <!-- 4. SAYIM ÖZETİ & ONAY -->
  <div id="summaryView" class="hidden">
    <div class="card">
      <h3 style="margin-top:0;">Sayım Özeti</h3>
      <div id="summaryContent"></div>
      <div style="margin-top:16px; display:flex; gap:8px;">
        <button onclick="confirmStockUpdate()" class="success" style="flex:1;">Kaydet & Güncelle</button>
        <button onclick="cancelSummary()" class="danger" style="flex:1;">İptal</button>
      </div>
    </div>
  </div>

  <!-- RAF QR GÖRÜNTÜLEME MODALI -->
  <div id="qrModal" class="modal-overlay hidden">
    <div class="card" style="width:85%; max-width:320px; text-align:center;">
      <h3 id="qrModalTitle" style="margin-top:0;">Raf QR</h3>
      <div id="qrcodeBox" style="display:flex; justify-content:center; padding:12px; background:#fff; border-radius:8px; margin-bottom:12px;"></div>
      <button onclick="closeQrModal()" class="secondary" style="width:100%;">Kapat</button>
    </div>
  </div>

  <!-- GİRİŞ MODAL -->
  <div id="authModal" class="modal-overlay hidden">
    <div class="card" style="width:85%; max-width:320px;">
      <h3 style="margin-top:0;">Yetkili Girişi</h3>
      <input type="text" id="adminUser" placeholder="Kullanıcı Adı (admin)">
      <input type="password" id="adminPass" placeholder="Şifre (1234)">
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button onclick="login()" class="success" style="flex:1;">Giriş</button>
        <button onclick="hideAuthModal()" class="secondary" style="flex:1;">Kapat</button>
      </div>
    </div>
  </div>

  <script>
    let warehouseData = JSON.parse(localStorage.getItem("boyner_p3_data")) || {
      "P3-01": { "8682272769469": 2 },
      "P3-02": {}
    };

    let activeRaf = "";
    let tempScanBatch = {};
    let html5QrCode = null;
    let searchScanner = null;
    let rafSelectScanner = null;
    let lastScanTime = 0;
    let lastCode = "";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 1400;
      gain.gain.value = 0.3;
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function saveDB() {
      localStorage.setItem("boyner_p3_data", JSON.stringify(warehouseData));
    }

    // Arama
    function searchProduct() {
      const q = document.getElementById("searchInput").value.trim();
      const res = document.getElementById("searchResult");
      if (!q) { res.innerHTML = ""; return; }
      
      let found = [];
      for (let raf in warehouseData) {
        if (warehouseData[raf][q]) {
          found.push({ raf: raf, count: warehouseData[raf][q] });
        }
      }

      if (found.length === 0) {
        res.innerHTML = `<div style="color:#ef4444; padding:8px 0;">Ürün P3 deposundaki hiçbir rafta bulunamadı.</div>`;
      } else {
        let html = "";
