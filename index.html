<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Boyner P3 Depo</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { margin: 0; padding: 12px; background: #0f172a; color: #fff; text-align: center; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #334155; margin-bottom: 15px; }
    button { background: #38bdf8; color: #000; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button.danger { background: #ef4444; color: #fff; }
    button.success { background: #22c55e; color: #fff; }
    button.warning { background: #f59e0b; color: #000; }
    button.secondary { background: #334155; color: #fff; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 16px; margin-bottom: 10px; }
    .card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; text-align: left; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; }
    #reader { width: 100%; min-height: 250px; background: #000; border-radius: 10px; overflow: hidden; }
  </style>
</head>
<body>

  <header>
    <div style="font-weight: 800; color: #38bdf8; font-size: 18px;">Boyner P3 Depo</div>
    <div>
      <button id="loginBtn" onclick="openLogin()">Yetkili Girişi</button>
      <button id="logoutBtn" onclick="doLogout()" class="danger" style="display:none;">Çıkış</button>
    </div>
  </header>

  <!-- ARAMA MODU -->
  <div id="searchSec" class="card">
    <h3 style="margin-top:0;">Ürün Ara</h3>
    <input type="text" id="searchInp" placeholder="Barkodu buraya yazın..." oninput="doSearch()">
    <div id="searchRes"></div>
  </div>

  <!-- YETKİLİ PANELİ -->
  <div id="adminSec" class="card" style="display:none;">
    <h3 style="margin-top:0;">Raf & Sayım Yönetimi</h3>
    <div style="display:flex; gap:8px;">
      <input type="text" id="newRafInp" placeholder="Yeni Raf (Örn: P3-05)">
      <button onclick="addRaf()" class="success" style="white-space:nowrap;">+ Raf Ekle</button>
    </div>
    <div id="rafListContainer" style="margin-top:10px;"></div>
  </div>

  <!-- SAYIM KAMERASI -->
  <div id="scanSec" class="card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>Raf: <strong id="curRafText" style="color:#38bdf8; font-size:18px;"></strong></div>
      <button onclick="abortScan()" class="secondary">Kapat</button>
    </div>
    <div id="reader" style="margin-top:10px;"></div>
    <div style="margin-top:12px; display:flex; justify-content:space-between; align-items:center;">
      <div>Okunan: <strong id="scanCounter" style="color:#22c55e; font-size:24px;">0</strong></div>
      <button onclick="stopAndSave()" class="success">Bitir & Kaydet</button>
    </div>
  </div>

  <!-- QR GÖSTERİM KUTUSU -->
  <div id="qrSec" class="card" style="display:none; text-align:center;">
    <h3 id="qrTitle">Raf QR</h3>
    <div id="qrImgBox" style="margin: 10px 0;"></div>
    <button onclick="closeQr()" class="secondary" style="width:100%;">Kapat</button>
  </div>

  <script>
    // Tarayıcı Hafızasındaki Veri
    var db = JSON.parse(localStorage.getItem("p3_depo_v1") || '{"P3-01": {"8684497451938": 1}}');
    var activeRaf = "";
    var tempCounts = {};
    var scanner = null;
    var lastCode = "";
    var lastTime = 0;

    function saveToStorage() {
      localStorage.setItem("p3_depo_v1", JSON.stringify(db));
    }

    // Bip sesi
    function bip() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 1400;
        gain.gain.value = 0.2;
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch(e){}
    }

    // Ürün Arama
    function doSearch() {
      var val = document.getElementById("searchInp").value.trim();
      var res = document.getElementById("searchRes");
      if(!val) { res.innerHTML = ""; return; }
      var found = [];
      for(var r in db) {
        if(db[r] && db[r][val]) found.push({ raf: r, qty: db[r][val] });
      }
      if(found.length === 0) {
        res.innerHTML = "<div style='color:#ef4444; padding:8px 0;'>Ürün depoda bulunamadı.</div>";
      } else {
        var h = "";
        for(var i=0; i<found.length; i++) {
          h += "<div class='row'><span>Raf: <strong>" + found[i].raf + "</strong></span><span style='background:#0284c7; padding:2px 8px; border-radius:4px;'>" + found[i].qty + " Adet</span></div>";
        }
        res.innerHTML = h;
      }
    }

    // Giriş / Çıkış
    function openLogin() {
      var u = prompt("Kullanıcı Adı:");
      if(!u) return;
      var p = prompt("Şifre:");
      if(u === "admin" && p === "1234") {
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("logoutBtn").style.display = "inline-block";
        document.getElementById("adminSec").style.display = "block";
        renderRaflar();
      } else {
        alert("Hatalı giriş!");
      }
    }

    function doLogout() {
      document.getElementById("loginBtn").style.display = "inline-block";
      document.getElementById("logoutBtn").style.display = "none";
      document.getElementById("adminSec").style.display = "none";
    }

    // Raf İşlemleri
    function addRaf() {
      var r = document.getElementById("newRafInp").value.trim().toUpperCase();
      if(!r) return;
      if(!db[r]) db[r] = {};
      document.getElementById("newRafInp").value = "";
      saveToStorage();
      renderRaflar();
    }

    function clearRaf(r) {
      if(confirm(r + " rafındaki ÜRÜNLERİ sıfırlamak istiyor musunuz? (Raf adı kalır)")) {
        db[r] = {};
        saveToStorage();
        renderRaflar();
      }
    }

    function deleteRaf(r) {
      if(confirm(r + " rafını TAMAMEN silmek istiyor musunuz?")) {
        delete db[r];
        saveToStorage();
        renderRaflar();
      }
    }

    function showQr(r) {
      document.getElementById("qrTitle").innerText = r + " QR";
      var url = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(r);
      document.getElementById("qrImgBox").innerHTML = "<img src='" + url + "' style='background:#fff; padding:10px; border-radius:8px;' />";
      document.getElementById("qrSec").style.display = "block";
      window.scrollTo(0, document.body.scrollHeight);
    }

    function closeQr() {
      document.getElementById("qrSec").style.display = "none";
    }

    function renderRaflar() {
      var cont = document.getElementById("rafListContainer");
      var h = "";
      for(var r in db) {
        var count = 0;
        for(var k in db[r]) { count += db[r][k]; }
        h += "<div class='row'>" +
               "<div><strong>" + r + "</strong><br><small style='color:#94a3b8;'>" + count + " Adet</small></div>" +
               "<div style='display:flex; gap:4px;'>" +
                 "<button onclick='startCount(\"" + r + "\")' class='success' style='padding:6px 10px;'>Sayım</button>" +
                 "<button onclick='showQr(\"" + r + "\")' class='secondary' style='padding:6px 10px;'>QR</button>" +
                 "<button onclick='clearRaf(\"" + r + "\")' class='warning' style='padding:6px 10px;'>Sıfırla</button>" +
                 "<button onclick='deleteRaf(\"" + r + "\")' class='danger' style='padding:6px 8px;'>🗑️</button>" +
               "</div>" +
             "</div>";
      }
      cont.innerHTML = h;
    }

    // Sayım Başlat
    function startCount(r) {
      activeRaf = r;
      tempCounts = {};
      lastCode = "";
      document.getElementById("curRafText").innerText = r;
      document.getElementById("scanCounter").innerText = "0";
      document.getElementById("searchSec").style.display = "none";
      document.getElementById("adminSec").style.display = "none";
      document.getElementById("scanSec").style.display = "block";

      scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 20, qrbox: { width: 250, height: 160 } },
        function(code) {
          var now = Date.now();
          if(code === lastCode && (now - lastTime) < 1200) return;
          lastCode = code;
          lastTime = now;
          bip();
          tempCounts[code] = (tempCounts[code] || 0) + 1;
          var total = 0;
          for(var x in tempCounts) { total += tempCounts[x]; }
          document.getElementById("scanCounter").innerText = total;
        }
      ).catch(function(err){
        alert("Kamera açılamadı: " + err);
        abortScan();
      });
    }

    function abortScan() {
      if(scanner) {
        scanner.stop().then(function(){ resetViews(); }).catch(function(){ resetViews(); });
      } else {
        resetViews();
      }
    }

    function stopAndSave() {
      if(scanner) {
        scanner.stop().then(function(){
          applyData();
        }).catch(function(){
          applyData();
        });
      } else {
        applyData();
      }
    }

    function applyData() {
      db[activeRaf] = tempCounts;
      saveToStorage();
      resetViews();
      renderRaflar();
      alert(activeRaf + " rafı güncellendi!");
    }

    function resetViews() {
      document.getElementById("scanSec").style.display = "none";
      document.getElementById("searchSec").style.display = "block";
      document.getElementById("adminSec").style.display = "block";
    }
  </script>
</body>
</html>
